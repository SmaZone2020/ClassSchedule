name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run build:app

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # The binary name comes from `mainBinaryName` in tauri.conf.json, so
          # read it instead of hardcoding a name that drifts from Cargo's.
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expected = @("$($conf.mainBinaryName).exe", "$($conf.productName).exe")

          $exe = $null
          foreach ($name in $expected) {
            $candidate = Join-Path "src-tauri/target/release" $name
            if (Test-Path $candidate) { $exe = Get-Item $candidate; break }
          }
          if (-not $exe) {
            # Fall back to the largest binary: the bundler leaves copies around.
            $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe -File |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }
          if (-not $exe) {
            throw "no executable found in src-tauri/target/release"
          }

          Write-Host "portable binary: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"
          Copy-Item $exe.FullName "release/ClassScheduleWidget-portable.exe"

          $installers = @(
            Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Filter *.exe -File -ErrorAction SilentlyContinue
          )
          if ($installers.Count -eq 0) {
            throw "no installer found under src-tauri/target/release/bundle"
          }

          foreach ($installer in $installers) {
            Write-Host "installer: $($installer.Name)"
            Copy-Item $installer.FullName "release/$($installer.Name)"
          }

          Get-ChildItem release | Select-Object Name, Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/*
